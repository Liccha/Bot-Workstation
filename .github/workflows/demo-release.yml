name: Isolated demo release

on:
  push:
    tags:
      - 'demo-v*'

permissions:
  contents: write

jobs:
  windows:
    name: Portable Windows client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp -DskipTests package
      - name: Package self-contained app image
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-input, release | Out-Null
          $jar = Get-ChildItem workstation/target -Filter '*-core.jar' | Select-Object -First 1
          Copy-Item -LiteralPath $jar.FullName release-input/BotWorkstationDemo.jar
          jpackage --type app-image --name BotWorkstationDemo --input release-input --main-jar BotWorkstationDemo.jar --main-class com.botstation.BotStationApp --dest release --app-version 1.1.13 --vendor Teacharm --description 'Bot 工作站隔离体验版' --icon workstation/src/main/resources/app/icon.ico
          Compress-Archive -Path release/BotWorkstationDemo -DestinationPath release/BotWorkstation-Demo-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: demo-windows
          path: release/BotWorkstation-Demo-Windows.zip
          if-no-files-found: error

  android:
    name: Android demo app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/widget_test.dart
      - name: Build installable demo APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --debug --build-name 1.1.13 --build-number 21 2>&1 | tee apk-build.log
      - name: Report APK build failure
        if: failure()
        shell: bash
        run: |
          message=$(tail -n 40 apk-build.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
          echo "::error title=Flutter APK build failed::$message"
      - run: mv build/app/outputs/flutter-apk/app-debug.apk ../BotWorkstation-Demo-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: demo-android
          path: BotWorkstation-Demo-Android.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: demo-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Bot 工作站隔离体验版
          body: |
            该版本只连接隔离的演示数据环境，不会读写正式数据。
            临时写权限最晚于 2026-10-07 23:59:59（北京时间）关闭，也可能提前关闭。
            Windows 包为免安装自带运行时版本；Android 包使用独立应用 ID，可与正式版并存。
          files: |
            dist/BotWorkstation-Demo-Windows.zip
            dist/BotWorkstation-Demo-Android.apk
          fail_on_unmatched_files: true
