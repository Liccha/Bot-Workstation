<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bot 工作站</title>
<link rel="stylesheet" href="assets/css/tokens.css?v=20260727-mobilemotion">
<link rel="stylesheet" href="assets/css/app.css?v=20260824-mobilegap18-stablecard">
</head>
<body oncontextmenu="return false" ondragstart="return false" onselectstart="return false">
<div class="tab-bar">
<button data-tab="announce" style="display:none">公告管理</button>
<button class="active" data-tab="library">曲库查询</button>
<button data-tab="design" hidden>卡片设计</button>
</div>

<!-- ==================== 公告管理 ==================== -->
<div class="tab-content" id="tabAnnounce">
<div class="a-app">
<h1>公告编辑器 <span id="apiStatus" style="font-size:11px;color:#94a3b8;font-weight:400"></span> <button class="we-btn" id="weOpenBtn" style="display:none" onclick="openWebsiteEditor()">网站编辑</button></h1>
<div class="a-grid" id="grid"></div>
<div class="a-pager" id="pager"></div>
</div>
<div class="overlay" id="dlgOverlay">
<div class="dialog" id="dlg">
<h2 id="dlgTitle"></h2>
<div class="sec"><label>公告内容</label><div style="display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap"><span class="tpl-capsule" data-tpl="album">专辑模板</span><span class="tpl-capsule" data-tpl="event">Event模板</span><span class="tpl-capsule" data-tpl="single">单曲模板</span><span class="tpl-capsule" data-tpl="cover">观影封面</span><span class="tpl-capsule" data-tpl="position">观影定位</span></div><textarea id="fContent" placeholder="输入公告正文..."></textarea></div>
<div class="sec"><label>发布时间</label>
<div style="position:relative;display:inline-block;width:100%">
<input type="text" id="fTime" readonly style="cursor:pointer;background:#fff;width:100%">
<div class="calendar" id="cal"></div></div></div>
<div class="sec"><label>目标群号</label>
<div class="gid-wrap"><input type="text" id="fGroup" value="2000000004"><div class="dd-btn" id="ddBtn">▼</div></div>
<div class="dd-menu" id="ddMenu"></div></div>
<div class="sec"><label>图片 (≤2MB)</label><input type="file" id="fImage" accept="image/*" style="font-size:12px"><span id="imgName" style="font-size:11px;color:#94a3b8;margin-left:8px">未选择</span></div>
<div class="sec"><label>附件</label><div class="file-zone" id="fileZone">点击或拖拽文件添加附件</div><ul class="attach-list" id="attachList"></ul></div>
<div class="sec chk-row"><label><input type="checkbox" id="fPin"> 置顶公告</label><label><input type="checkbox" id="fConfirm"> 需群成员确认</label></div>
<div class="btn-row"><button class="btn secondary" id="btnCancel">取消</button><button class="btn primary" id="btnSave">保存公告</button></div>
</div></div>
</div>


<!-- ==================== 网站编辑器 ==================== -->
<div class="we-overlay" id="weOverlay">
<div class="we-dialog">
<div class="we-header">
<h2>网站编辑</h2>
<div class="we-header-actions">
<button class="btn secondary" style="padding:5px 12px;font-size:12px" onclick="syncPosts()">刷新同步</button>
<button class="btn secondary" style="padding:5px 12px;font-size:12px" onclick="closeWebsiteEditor()">关闭</button>
</div>
</div>
<div class="we-body">
<div class="we-sidebar">
<div class="we-sidebar-toolbar">
<button onclick="syncPosts()" title="从服务器同步文件列表">刷新</button>
<button class="we-upload-btn" onclick="uploadNewMd()">上传 .md</button>
<input type="file" id="weFileInput" accept=".md" style="display:none" onchange="handleMdUpload(this)">
</div>
<div class="we-file-list" id="weFileList">
<div class="we-empty-state">点击刷新同步文件...</div>
</div>
</div>
<div class="we-editor-area">
<div class="we-editor-toolbar" id="weEditorToolbar" style="display:none">
<span class="we-filename" id="weFileName">—</span>
<button class="we-dl-btn" id="weDownloadBtn" onclick="downloadCurrentMd()">下载</button>
<button class="we-save-btn" id="weSaveBtn" onclick="saveCurrentMd()">保存文章</button>
</div>
<textarea class="we-editor-textarea" id="weEditor" placeholder="选择左侧文件进行编辑..." style="display:none"></textarea>
<div class="we-empty-state" id="weEditorEmpty">← 选择左侧文件进行编辑</div>
</div>
</div>
</div>
</div>
<div class="we-toast" id="weToast"></div>

<!-- ==================== 曲库查询 ==================== -->
<div class="tab-content active" id="tabLibrary">
<div style="padding:20px;max-width:1400px;margin:0 auto;width:100%">
<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap" id="libToolbar">
<div style="display:flex;gap:6px;flex-wrap:wrap" id="libFilters"><span class="tpl-capsule active" data-flt="ALL" role="button" tabindex="0" aria-pressed="true"><span class="ct">ALL</span></span><span class="tpl-capsule" data-flt="4K" role="button" tabindex="0" aria-pressed="false"><span class="ct">4键</span></span><span class="tpl-capsule" data-flt="5K" role="button" tabindex="0" aria-pressed="false"><span class="ct">5键</span></span><span class="tpl-capsule" data-flt="6K" role="button" tabindex="0" aria-pressed="false"><span class="ct">6键</span></span><span class="tpl-capsule" data-flt="Catch" role="button" tabindex="0" aria-pressed="false"><span class="ct">Catch</span></span></div>
<div style="flex:1" id="libToolbarSpacer"></div>
<div style="display:flex;align-items:center;gap:8px" id="libSearchWrap">
<input class="lib-search" id="libSearch" placeholder="搜索..." autocomplete="off" style="margin:0;max-width:220px">
<div class="lib-tip" id="libTip" title="提示">!</div>
</div>
</div>
<div class="lib-stats" id="libStats"></div>
<div class="lib-grid" id="libGrid"></div>
</div>
</div>


<!-- ==================== 卡片设计器 ==================== -->
<div class="tab-content" id="tabDesign" hidden>
<div class="ds-workspace">
<div class="ds-canvas" id="dsCanvas">
 <div class="ds-canvas-bg">
  <div class="ds-card-preview" id="dsCard"></div>
  <div id="dsPCard" style="display:none;max-width:96vw"></div>
  <div id="dsFCard" style="display:none;max-width:96vw"></div>
 </div>
</div>
<div class="ds-panel2">
 <div class="ds-mode-tabs">
  <button class="ds-mtab active" id="dsModeCard">卡片</button>
  <button class="ds-mtab" id="dsModePopup">小窗</button>
  <button class="ds-mtab" id="dsModeFilter">胶囊</button>
 </div>
 <h3>元素列表</h3>
 <div class="ds-el-list" id="dsElList"></div>
 <div id="dsProps"></div>
 <div class="ds-toolbar">
  <button class="reset-btn" id="dsReset">重置</button>
  <button class="save-btn" id="dsSave">注入保存</button>
 </div>
</div>
</div>
</div>
<div class="ds-toast" id="dsToast"></div>

<div class="lib-detail" id="libDetail"><div class="dd" id="libDetailContent"></div></div>
<div class="toast" id="toast"></div>
